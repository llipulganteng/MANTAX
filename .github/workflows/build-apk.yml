name: Build MANTAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Extract MANTAX source
        run: |
          mkdir -p mantax-source
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$ZIP" -d mantax-source

      - name: Build APK
        working-directory: mantax-source/android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANTAX-APK
          path: mantax-source/android/app/build/outputs/apk/debug/app-debug.apk
